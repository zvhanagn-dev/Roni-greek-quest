function home(){active=null;$('categories').classList.remove('hide');$('exercise').classList.add('hide');$('home').style.display='none';$('categories').replaceChildren();$('summary').textContent=keys.reduce((s,k)=>s+DATA[k].length,0)+' questions · '+keys.length+' categories · Choose a topic';keys.forEach((k,i)=>{let b=el('button',{className:'cat'});b.append(el('strong',{},k),el('small',{},DATA[k].length+' questions · '+(stats[k]?.best??0)+' best correct'));b.onclick=()=>start(k);$('categories').append(b)})}

function render(){let qs=DATA[active];answered=false;$('next').classList.add('hide');$('skip').classList.remove('hide');$('restart').classList.add('hide');$('feedback').className='hide';$('feedback').textContent='';$('choices').replaceChildren();$('visual').replaceChildren();$('visual').classList.add('hide');if(index>=qs.length){$('counter').textContent='Finished!';$('bar').style.width='100%';$('question').textContent='Great work! 🎉';$('choices').replaceChildren();$('visual').classList.add('hide');$('feedback').className='feedback ok';$('feedback').textContent=`You answered ${correct} of ${qs.length} correctly. Try again to improve your score!`;stats[active]={best:Math.max(correct,stats[active]?.best||0)};save();$('skip').classList.add('hide');$('restart').classList.remove('hide');return}
let q=qs[index];$('counter').textContent=`Question ${index+1} of ${qs.length} · ${correct} correct`;$('bar').style.width=(100*index/qs.length)+'%';$('question').textContent=q.q;if(q.visual)draw(q.visual);q.opts.forEach(v=>{let b=el('button',{className:'choice'},v);b.onclick=()=>choose(v,b,q);$('choices').append(b)})}
function choose(v,b,q){if(answered)return;answered=true;let good=v===q.a;if(good)correct++;[...$('choices').children].forEach(x=>{x.disabled=true;if(x.textContent===q.a)x.classList.add('correct')});if(!good)b.classList.add('wrong');$('feedback').className='feedback '+(good?'ok':'no');$('feedback').textContent=(good?'✓ Correct!':'✗ Correct answer: '+q.a)+(q.note?'  '+q.note:'');$('next').classList.remove('hide');$('skip').classList.add('hide')}
function draw(v){$('visual').classList.remove('hide');if(v.type==='color'){$('visual').append(el('div',{className:'swatch',style:'background:'+v.hex}));return}if(v.type==='passage'){$('visual').append(el('div',{className:'story'},v.text));return}if(v.type==='position'){let p=v.pos,n=v.noun;let isTable=n==='τραπέζι';let rect=isTable?'<rect x="95" y="115" width="230" height="18" rx="4" fill="#b88655"/><rect x="115" y="133" width="15" height="110" fill="#9a683f"/><rect x="288" y="133" width="15" height="110" fill="#9a683f"/>':'<rect x="125" y="95" width="170" height="140" rx="8" fill="#efc88e" stroke="#98643d" stroke-width="4"/>';let x=210,y=70;if(p==='πάνω στο'){x=210;y=isTable?96:76}else if(p==='πάνω από το'){x=210;y=30}else if(p==='κάτω από το'){x=210;y=isTable?188:263}else if(p==='δίπλα στο'){x= isTable?354:326;y=isTable?115:170}else if(p==='μέσα στο'){x=210;y=isTable?175:165}let svg=`<svg class="diagram" viewBox="0 0 420 305" role="img" aria-label="Blue ball and ${n}"><rect width="420" height="305" fill="#eaf4fa"/><line x1="22" y1="275" x2="398" y2="275" stroke="#a9c4d3" stroke-width="3"/>${rect}<circle cx="${x}" cy="${y}" r="22" fill="#3689d3" stroke="#155b99" stroke-width="3"/><path d="M${x-12} ${y-8} Q${x} ${y-20} ${x+12} ${y-8}" fill="none" stroke="#b3e0ff" stroke-width="4" stroke-linecap="round"/></svg>`;$('visual').innerHTML=svg}}
$('next').onclick=()=>{index++;render()};$('skip').onclick=()=>{index++;render()};$('restart').onclick=()=>start(active);$('home').onclick=home;home();
</script></body></html>
